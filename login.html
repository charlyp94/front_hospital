<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Panel de Gestión</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo morado idéntico al de tu vista principal */
            background-color: #4a2c35;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Logo de fondo con transparencia (marca de agua) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Asegurate de poner el nombre exacto de la imagen de tu logo */
            background-image: url('logo.jpg'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            opacity: 0.08; /* Transparencia sutil de fondo */
            z-index: -1;
            pointer-events: none;
        }

        .login-card {
            /* Tarjeta con fondo blanco/semitransparente o sólida para que resalte */
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            color: #333;
        }

        .login-card h2 {
            margin-top: 0;
            color: #4a2c35;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .login-card p.subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: #4a2c35;
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 44, 53, 0.2);
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #4a2c35;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover {
            background-color: #351f26;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acceso Panel de Gestión</h2>
        <p class="subtitle">Ingrese sus credenciales para continuar</p>
        
        <div id="errorMessage" class="error-message hidden"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="nombre_usuario">Nombre de Usuario</label>
                <input type="text" id="nombre_usuario" required autocomplete="username" placeholder="Ej. charly94">
            </div>
            
            <div class="form-equal form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit">Entrar al Sistema</button>
        </form>

        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            errorMessage.textContent = '';

            const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();

            try {
                const response = await fetch('https://back-hospital-euk1.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre_usuario, contrasena })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }

                sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                    nombre: data.nombre,
                    rol: data.rol
                }));

                if (data.rol === 'superadmin' || data.rol === 'admin') {
                    window.location.href = 'admins.html'; 
                } else {
                    window.location.href = 'index.html';
                }

            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
