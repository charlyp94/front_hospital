<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Panel de Gestión</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #4a2c35;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Logo de fondo con transparencia visible */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logo-hospital.png'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            opacity: 0.18;
            z-index: -1;
            pointer-events: none;
        }

        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            color: #333;
            position: relative;
        }

        .login-card h2 {
            margin-top: 0;
            color: #4a2c35;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .login-card p.subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: #4a2c35;
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 44, 53, 0.2);
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #4a2c35;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover {
            background-color: #351f26;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* --- MODAL GRANDE CON CIERRE AUTOMÁTICO (SIN BOTÓN OK) --- */
        #feedbackOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #feedbackOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        .feedback-modal {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            transform: scale(0.85);
            transition: transform 0.3s ease;
        }

        #feedbackOverlay.active .feedback-modal {
            transform: scale(1);
        }

        /* Círculo superior para el ícono animado */
        .icon-container {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid;
            background: #fff;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Variantes de color */
        .feedback-modal.error .icon-container {
            border-color: #e57373;
            color: #d32f2f;
        }
        .feedback-modal.success .icon-container {
            border-color: #81c784;
            color: #388e3c;
        }

        .feedback-modal h3 {
            margin: 0 0 0.8rem 0;
            font-size: 1.4rem;
            color: #333;
        }

        .feedback-modal.error h3 { color: #d32f2f; }
        .feedback-modal.success h3 { color: #388e3c; }

        .feedback-modal p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Animación SVG interna para la Tilde y la X */
        .svg-icon {
            width: 45px;
            height: 45px;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .feedback-modal.success .svg-icon { stroke: #388e3c; }
        .feedback-modal.error .svg-icon { stroke: #d32f2f; }

        /* Animación de trazo */
        .path-anim {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawPath 0.4s ease forwards 0.2s;
        }

        @keyframes drawPath {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acceso Panel de Gestión</h2>
        <p class="subtitle">Ingrese sus credenciales para continuar</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="nombre_usuario">Nombre de Usuario</label>
                <input type="text" id="nombre_usuario" required autocomplete="username" placeholder="Ej. charly94">
            </div>
            
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" id="btnSubmit">Entrar al Sistema</button>
        </form>

        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <!-- Modal grande con cierre automático -->
    <div id="feedbackOverlay">
        <div class="feedback-modal" id="feedbackModalBox">
            <div class="icon-container" id="iconContainer"></div>
            <h3 id="feedbackTitle">Título</h3>
            <p id="feedbackText">Mensaje</p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackModalBox = document.getElementById('feedbackModalBox');
        const iconContainer = document.getElementById('iconContainer');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackText = document.getElementById('feedbackText');
        const btnSubmit = document.getElementById('btnSubmit');

        function mostrarModalTemporal(tipo, titulo, mensaje, callback) {
            feedbackModalBox.className = `feedback-modal ${tipo}`;
            feedbackTitle.textContent = titulo;
            feedbackText.textContent = mensaje;

            if (tipo === 'success') {
                iconContainer.innerHTML = `
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path class="path-anim" d="M20 6L9 17l-5-5"/>
                    </svg>
                `;
            } else {
                iconContainer.innerHTML = `
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path class="path-anim" d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                `;
            }

            feedbackOverlay.classList.add('active');

            // Se muestra durante 1.2 segundos y luego se oculta ejecutando la acción
            setTimeout(() => {
                feedbackOverlay.classList.remove('active');
                if (callback) callback();
            }, 1200);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Verificando...';

            const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();

            try {
                const response = await fetch('https://back-hospital-euk1.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre_usuario, contrasena })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }

                sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                    nombre: data.nombre,
                    rol: data.rol
                }));

                // Éxito: muestra la tilde 1.2 segundos y redirige
                mostrarModalTemporal('success', '¡Acceso Concedido!', `Bienvenido, ${data.nombre}`, () => {
                    if (data.rol === 'superadmin' || data.rol === 'admin') {
                        window.location.href = 'admins.html'; 
                    } else {
                        window.location.href = 'index.html';
                    }
                });

            } catch (error) {
                // Error: muestra la X 1.2 segundos y habilita de nuevo el botón
                mostrarModalTemporal('error', 'Acceso Denegado', error.message || 'Usuario o contraseña incorrectos.', () => {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Entrar al Sistema';
                });
            }
        });
    </script>
</body>
</html>
