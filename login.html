<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SISGESD</title>
    <style>
        /* Copiar o incluir los estilos generales de arriba aquí */
        :root {
            --color-primario: #4a2c35;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('logo-hospital.png'); /* Ruta de tu logo */
            background-repeat: no-repeat;
            background-position: center;
            background-size: 400px;
            opacity: 0.04;
            z-index: -1;
        }

        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border-top: 5px solid var(--color-primario);
        }

        .login-card h2 {
            margin-top: 0;
            color: var(--color-primario);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: var(--color-primario);
            outline: none;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--color-primario);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #382128;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }
    </style>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen m-0">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">SISGESD Sistema de Gestión de Donaciones - Acceso Panel de Gestión</h2>
            <p class="text-sm text-gray-500 mt-1">Ingrese sus credenciales para continuar</p>
        </div>

        <!-- Formulario de Login -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario</label>
                <input type="text" id="nombre_usuario" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Ej. charly94">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="contrasena" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="••••••••">
            </div>

            <div id="errorMessage" class="text-red-500 text-sm text-center hidden"></div>

            <button type="submit" 
                class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                Entrar al Sistema
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="index.html" class="text-sm text-blue-600 hover:underline">← Volver al inicio</a>
        </div>
    </div>

    <!-- Script de Autenticación -->
<script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.classList.add('hidden');
        errorMessage.textContent = '';

        const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
        const contrasena = document.getElementById('contrasena').value.trim();

        try {
            // Apuntamos directamente al backend desplegado en Render
            const response = await fetch('https://back-hospital-euk1.onrender.com/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre_usuario, contrasena })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Credenciales incorrectas');
            }

            // Guardamos los datos del usuario logueado en el navegador (SessionStorage)
            sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                nombre: data.nombre,
                rol: data.rol
            }));

            // Redirección según el rol devuelto por la base de datos (apuntando a admins.html)
            if (data.rol === 'superadmin' || data.rol === 'admin') {
                window.location.href = 'admins.html'; 
            } else {
                window.location.href = 'index.html';
            }

        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
