<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Panel de Gestión</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #4a2c35;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Logo de fondo con transparencia visible (opacidad ajustada) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logo.jpg'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            opacity: 0.18; /* Se nota bien de fondo */
            z-index: -1;
            pointer-events: none;
        }

        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            color: #333;
            position: relative;
        }

        .login-card h2 {
            margin-top: 0;
            color: #4a2c35;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .login-card p.subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: #4a2c35;
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 44, 53, 0.2);
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #4a2c35;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover {
            background-color: #351f26;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* --- ESTILOS PARA LA ANIMACIÓN DE ACCESO (MODAL FEEDBACK) --- */
        #feedbackOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #feedbackOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        .feedback-box {
            background: white;
            padding: 2rem 3rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        #feedbackOverlay.active .feedback-box {
            transform: scale(1);
        }

        .feedback-box h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.4rem;
        }

        .feedback-box p {
            margin: 0;
            color: #555;
            font-size: 0.95rem;
        }

        /* Colores dinámicos según éxito o error */
        .feedback-box.success h3 { color: #28a745; }
        .feedback-box.error h3 { color: #dc3545; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acceso Panel de Gestión</h2>
        <p class="subtitle">Ingrese sus credenciales para continuar</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="nombre_usuario">Nombre de Usuario</label>
                <input type="text" id="nombre_usuario" required autocomplete="username" placeholder="Ej. charly94">
            </div>
            
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" id="btnSubmit">Entrar al Sistema</button>
        </form>

        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <!-- Capa de animación para el resultado del login -->
    <div id="feedbackOverlay">
        <div class="feedback-box" id="feedbackBox">
            <h3 id="feedbackTitle">Título</h3>
            <p id="feedbackText">Mensaje</p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackText = document.getElementById('feedbackText');
        const btnSubmit = document.getElementById('btnSubmit');

        function mostrarFeedback(tipo, titulo, mensaje, callback) {
            feedbackBox.className = `feedback-box ${tipo}`;
            feedbackTitle.textContent = titulo;
            feedbackText.textContent = mensaje;
            
            feedbackOverlay.classList.add('active');

            setTimeout(() => {
                feedbackOverlay.classList.remove('active');
                if (callback) callback();
            }, 1800); // Se muestra la animación durante 1.8 segundos
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Verificando...';

            const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();

            try {
                const response = await fetch('https://back-hospital-euk1.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre_usuario, contrasena })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }

                // Guardamos sesión
                sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                    nombre: data.nombre,
                    rol: data.rol
                }));

                // Animación de éxito
                mostrarFeedback('success', '¡Acceso Concedido!', `Bienvenido, ${data.nombre}`, () => {
                    if (data.rol === 'superadmin' || data.rol === 'admin') {
                        window.location.href = 'admins.html'; 
                    } else {
                        window.location.href = 'index.html';
                    }
                });

            } catch (error) {
                // Animación de error
                mostrarFeedback('error', 'Acceso Denegado', error.message || 'Usuario o contraseña incorrectos', () => {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Entrar al Sistema';
                });
            }
        });
    </script>
</body>
</html>
