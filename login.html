<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SISGESD</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen m-0">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">SISGESD Sistema de Gestión de Donaciones - Acceso Panel de Gestión</h2>
            <p class="text-sm text-gray-500 mt-1">Ingrese sus credenciales para continuar</p>
        </div>

        <!-- Formulario de Login -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario</label>
                <input type="text" id="nombre_usuario" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Ej. charly94">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="contrasena" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="••••••••">
            </div>

            <div id="errorMessage" class="text-red-500 text-sm text-center hidden"></div>

            <button type="submit" 
                class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                Entrar al Sistema
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="index.html" class="text-sm text-blue-600 hover:underline">← Volver al inicio</a>
        </div>
    </div>

    <!-- Script de Autenticación -->
<script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessage.classList.add('hidden');
        errorMessage.textContent = '';

        const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
        const contrasena = document.getElementById('contrasena').value.trim();

        try {
            // Apuntamos directamente al backend desplegado en Render
            const response = await fetch('https://back-hospital-euk1.onrender.com/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre_usuario, contrasena })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Credenciales incorrectas');
            }

            // Guardamos los datos del usuario logueado en el navegador (SessionStorage)
            sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                nombre: data.nombre,
                rol: data.rol
            }));

            // Redirección según el rol devuelto por la base de datos (apuntando a admins.html)
            if (data.rol === 'superadmin' || data.rol === 'admin') {
                window.location.href = 'admins.html'; 
            } else {
                window.location.href = 'index.html';
            }

        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
