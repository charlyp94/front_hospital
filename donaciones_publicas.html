<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donaciones Recibidas - Hospital Luis A. Güemes</title>
    <link rel="icon" type="image/jpg" href="logo.jpg">
    <style>
        /* --- ESTILOS GENERALES Y DE FONDO --- */
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #4a2c35;
            color: #333;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 480px;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('logo.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* Barra superior */
        .navbar {
            background: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 60px;
            width: 80px;
            object-fit: contain;
        }

        .logo-texto h2 {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #111111;
            margin: 0;
        }

        .logo-texto p {
            font-size: 0.75rem;
            color: #555555;
            font-weight: 600;
            margin: 2px 0 0 0;
        }

        /* Título de la página */
        .page-title {
            text-align: center;
            color: white;
            padding: 25px 15px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 1.8em;
        }

        /* Contenedor flotante de la tabla optimizado */
        .table-container {
            max-width: 1100px;
            width: 96%;
            margin: 0 auto 20px auto;
            background: white;
            padding: 15px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background-color: #332126;
            color: white;
            padding: 12px 10px;
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            border-bottom: 1px solid #ddd;
            padding: 12px 10px;
            text-align: center;
            font-size: 13px;
        }

        /* Fila interactiva tanto para PC como para celulares */
        .fila-donacion {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .fila-donacion:hover {
            background-color: #f1f1f1;
        }

        /* --- VENTANA FLOTANTE (MODAL) CON ANIMACIÓN FLUIDA --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: left;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #4a2c35;
            font-size: 1.3rem;
            text-align: center;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-detalle {
            margin: 10px 0;
            font-size: 15px;
            color: #444;
            word-wrap: break-word;
        }

        .modal-detalle strong {
            color: #332126;
        }

        .modal-btn-cerrar {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            background-color: #1e8449;
            color: white;
            text-align: center;
        }

        .modal-btn-cerrar:hover {
            background-color: #145a32;
        }

        /* Botón Volver estilizado */
        .btn-volver {
            display: block;
            width: 160px;
            margin: 20px auto 40px auto;
            padding: 12px;
            background: #1e8449;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background 0.2s ease;
        }

        .btn-volver:hover {
            background: #145a32;
        }

        /* --- MEDIA QUERIES PARA CELULARES --- */
        @media (max-width: 768px) {
            .navbar {
                padding: 8px 12px;
            }
            .logo-img {
                height: 45px;
                width: 60px;
            }
            .logo-texto h2 {
                font-size: 0.85rem;
            }
            .logo-texto p {
                font-size: 0.65rem;
            }
            .page-title h1 {
                font-size: 1.4em;
            }
            .table-container {
                width: 98%;
                padding: 10px 5px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo Hospital Luis A. Güemes" class="logo-img">
            <div class="logo-texto">
                <h2>HOSPITAL LUIS A. GÜEMES</h2>
                <p>A.O. III AGUARAY - SALTA</p>
            </div>
        </div>
    </div>

    <div class="page-title">
        <h1>Donaciones Aprobadas y Destinadas</h1>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table id="tabla-publica">
                <thead>
                    <tr>
                        <th>Nombre / Empresa</th>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Cantidad</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    <tr>
                        <td colspan="5" style="color: #666; font-style: italic;">Cargando registros públicos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a href="index.html" class="btn-volver">Volver al Inicio</a>

    <!-- VENTANA FLOTANTE (MODAL) CON RESUMEN -->
    <div id="modalResumen" class="modal-overlay">
        <div class="modal-content">
            <h3>Detalle de Donación</h3>
            <div id="modalContenidoTexto"></div>
            <button class="modal-btn-cerrar" onclick="cerrarModalResumen()">Cerrar</button>
        </div>
    </div>

    <!-- Cargamos el archivo de configuración global -->
    <script src="config.js"></script>

    <script>
        async function cargarDonacionesPublicas() {
            try {
                const urlApi = (typeof CONFIG !== 'undefined' && CONFIG.API_BASE_URL) 
                    ? `${CONFIG.API_BASE_URL}/api/donaciones/aprobadas` 
                    : 'https://back-hospital-euk1.onrender.com/api/donaciones/aprobadas';

                const res = await fetch(urlApi);
                const datos = await res.json();
                const cuerpo = document.getElementById('cuerpo-tabla');

                cuerpo.innerHTML = '';

                if (!datos || datos.length === 0) {
                    cuerpo.innerHTML = '<tr><td colspan="5" style="color: #777; padding: 20px;">Aún no hay donaciones aprobadas para mostrar.</td></tr>';
                    return;
                }

                cuerpo.innerHTML = datos.map(d => {
                    const fechaFormateada = d.fecha ? new Date(d.fecha).toLocaleDateString('es-AR') : 'Sin fecha';
                    const nombreTexto = d.nombre || d.nombreCompleto || 'Anónimo';
                    const categoriaTexto = d.categoria || 'General';
                    const cantidadValor = d.cantidad || 0;
                    
                    // Capturamos el detalle / descripción de forma segura
                    const detalleTexto = d.descripcion || d.detalle || d.observaciones || 'Sin detalle';

                    // Codificamos para pasar por parámetro al modal de forma segura
                    const nombreSeguro = encodeURIComponent(nombreTexto);
                    const fechaSegura = encodeURIComponent(fechaFormateada);
                    const categoriaSegura = encodeURIComponent(categoriaTexto);
                    const cantidadSegura = encodeURIComponent(cantidadValor);
                    const detalleSeguro = encodeURIComponent(detalleTexto);

                    return `
                        <tr class="fila-donacion" onclick="manejarClickFila('${nombreSeguro}', '${fechaSegura}', '${categoriaSegura}', '${cantidadSegura}', '${detalleSeguro}')">
                            <td style="font-weight: bold; color: #222;">${nombreTexto}</td>
                            <td>${fechaFormateada}</td>
                            <td>${categoriaTexto}</td>
                            <td>${cantidadValor}</td>
                            <td style="max-width: 180px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;" title="${detalleTexto}">${detalleTexto}</td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error al cargar datos públicos:", error);
                const cuerpo = document.getElementById('cuerpo-tabla');
                cuerpo.innerHTML = '<tr><td colspan="5" style="color: red; font-weight: bold; padding: 20px;">Error al conectar con el servidor.</td></tr>';
            }
        }

        // Lógica para abrir el resumen flotante tanto en PC como en celulares
        function manejarClickFila(nombre, fecha, categoria, cantidad, detalle) {
            const contenido = document.getElementById('modalContenidoTexto');
            contenido.innerHTML = `
                <div class="modal-detalle"><strong>Nombre:</strong> ${decodeURIComponent(nombre)}</div>
                <div class="modal-detalle"><strong>Fecha:</strong> ${decodeURIComponent(fecha)}</div>
                <div class="modal-detalle"><strong>Categoría:</strong> ${decodeURIComponent(categoria)}</div>
                <div class="modal-detalle"><strong>Cantidad:</strong> ${decodeURIComponent(cantidad)}</div>
                <div class="modal-detalle"><strong>Detalle:</strong> ${decodeURIComponent(detalle)}</div>
            `;

            const modal = document.getElementById('modalResumen');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('active');
            }, 10);
        }

        function cerrarModalResumen() {
            const modal = document.getElementById('modalResumen');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', cargarDonacionesPublicas);
    </script>
</body>

</html>
