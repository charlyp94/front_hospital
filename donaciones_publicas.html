<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donaciones Recibidas - Hospital Luis A. Güemes</title>
    <link rel="icon" type="image/jpg" href="logo.jpg">
    <style>
        /* --- ESTILOS GENERALES Y DE FONDO --- */
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #4a2c35;
            color: #333;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 480px;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('logo.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* Barra superior */
        .navbar {
            background: white;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 70px;
            width: 90px;
            object-fit: contain;
        }

        .logo-texto h2 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #111111;
            margin: 0;
        }

        .logo-texto p {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
            margin: 2px 0 0 0;
        }

        /* Título de la página */
        .page-title {
            text-align: center;
            color: white;
            padding: 30px 15px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 2.2em;
        }

        /* Contenedor flotante de la tabla adaptativo */
        .table-container {
            max-width: 1000px;
            width: 94%;
            margin: 0 auto 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        /* Contenedor con scroll horizontal para celulares */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px; /* Asegura que no se comprima de más en pantallas chicas */
        }

        th {
            background-color: #332126;
            color: white;
            padding: 14px 12px;
            font-size: 15px;
        }

        td {
            border-bottom: 1px solid #ddd;
            padding: 14px 12px;
            text-align: center;
            font-size: 14px;
        }

        /* Botón Volver estilizado */
        .btn-volver {
            display: block;
            width: 180px;
            margin: 20px auto 50px auto;
            padding: 12px;
            background: #1e8449;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background 0.2s ease;
        }

        .btn-volver:hover {
            background: #145a32;
        }

        /* --- MEDIA QUERIES PARA CELULARES (<= 768px) --- */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
            }
            .logo-img {
                height: 50px;
                width: 65px;
            }
            .logo-texto h2 {
                font-size: 0.9rem;
            }
            .logo-texto p {
                font-size: 0.7rem;
            }
            .page-title h1 {
                font-size: 1.6em;
            }
            .table-container {
                padding: 15px 10px;
                width: 92%;
            }
            th, td {
                padding: 10px 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo Hospital Luis A. Güemes" class="logo-img">
            <div class="logo-texto">
                <h2>HOSPITAL LUIS A. GÜEMES</h2>
                <p>A.O. III AGUARAY - SALTA</p>
            </div>
        </div>
    </div>

    <div class="page-title">
        <h1>Donaciones Aprobadas y Destinadas</h1>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table id="tabla-publica">
                <thead>
                    <tr>
                        <th>Nombre / Empresa</th>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    <tr>
                        <td colspan="4" style="color: #666; font-style: italic;">Cargando registros públicos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a href="index.html" class="btn-volver">Volver al Inicio</a>

    <!-- 1. Cargamos primero el archivo de configuración global -->
    <script src="config.js"></script>

    <script>
        async function cargarDonacionesPublicas() {
            try {
                // Se utiliza CONFIG.API_BASE_URL definida en config.js de forma dinámica
                const urlApi = (typeof CONFIG !== 'undefined' && CONFIG.API_BASE_URL) 
                    ? `${CONFIG.API_BASE_URL}/api/donaciones/aprobadas` 
                    : 'https://back-hospital-euk1.onrender.com/api/donaciones/aprobadas';

                const res = await fetch(urlApi);
                const datos = await res.json();
                const cuerpo = document.getElementById('cuerpo-tabla');

                cuerpo.innerHTML = '';

                if (!datos || datos.length === 0) {
                    cuerpo.innerHTML = '<tr><td colspan="4" style="color: #777; padding: 20px;">Aún no hay donaciones aprobadas para mostrar.</td></tr>';
                    return;
                }

                cuerpo.innerHTML = datos.map(d => `
                    <tr>
                        <td style="font-weight: bold; color: #222;">${d.nombre}</td>
                        <td>${d.fecha ? new Date(d.fecha).toLocaleDateString('es-AR') : 'Sin fecha'}</td>
                        <td>${d.categoria}</td>
                        <td>${d.cantidad || 0}</td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error("Error al cargar datos públicos:", error);
                const cuerpo = document.getElementById('cuerpo-tabla');
                cuerpo.innerHTML = '<tr><td colspan="4" style="color: red; font-weight: bold; padding: 20px;">Error al conectar con el servidor.</td></tr>';
            }
        }

        // Ejecuta la carga cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', cargarDonacionesPublicas);
    </script>
</body>

</html>
