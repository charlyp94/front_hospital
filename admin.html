<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión - Hospital Luis A. Güemes</title>
    <link rel="icon" type="image/jpg" href="logo.jpg">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #4a2c35;
            color: #333;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 480px;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('logo.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* Barra superior */
        .navbar {
            background: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 60px;
            width: 80px;
            object-fit: contain;
        }

        .logo-texto h2 {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #111111;
            margin: 0;
        }

        .logo-texto p {
            font-size: 0.75rem;
            color: #555555;
            font-weight: 600;
            margin: 2px 0 0 0;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            font-weight: bold;
        }

        /* Botón Volver estilizado */
        .btn-volver {
            display: inline-block;
            padding: 8px 14px;
            background: #1e8449;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background 0.2s ease;
        }

        .btn-volver:hover {
            background: #145a32;
        }

        /* Título */
        .page-title {
            text-align: center;
            color: white;
            padding: 25px 15px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 1.8em;
        }

        /* Contenedor de la tabla adaptativo */
        .table-container {
            max-width: 1100px;
            width: 96%;
            margin: 0 auto 30px auto;
            background: white;
            padding: 15px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        /* Contenedor con scroll horizontal para celulares */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px; /* Asegura espacio suficiente para las 7 columnas */
        }

        th {
            background-color: #332126;
            color: white;
            padding: 12px 10px;
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            border-bottom: 1px solid #ddd;
            padding: 12px 10px;
            text-align: center;
            font-size: 13px;
        }

        /* Estilo del botón CAMBIAR */
        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background-color: #09cf37;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .dropdown-toggle:hover {
            background-color: #037b23;
        }

        /* Menú desplegable */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 150px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            z-index: 1000;
            text-align: left;
        }

        .dropdown-item {
            padding: 10px 12px;
            display: block;
            cursor: pointer;
            color: #333;
            font-size: 13px;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item.selected {
            background-color: #09cf37;
            color: white;
        }

        /* --- MEDIA QUERIES PARA CELULARES --- */
        @media (max-width: 768px) {
            .navbar {
                padding: 8px 12px;
            }
            .logo-img {
                height: 45px;
                width: 60px;
            }
            .logo-texto h2 {
                font-size: 0.85rem;
            }
            .logo-texto p {
                font-size: 0.65rem;
            }
            .page-title h1 {
                font-size: 1.4em;
            }
            .table-container {
                width: 98%;
                padding: 10px 5px;
            }
            .btn-volver {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo Hospital Luis A. Güemes" class="logo-img">
            <div class="logo-texto">
                <h2>HOSPITAL LUIS A. GÜEMES</h2>
                <p>A.O. III AGUARAY - SALTA</p>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="btn-volver">Volver al Inicio</a>
        </div>
    </div>

    <div class="page-title">
        <h1>Donaciones - Panel de Gestión</h1>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Fecha de Donación</th>
                        <th>DNI</th>
                        <th>Categoría</th>
                        <th>Cantidad</th>
                        <th>Estado Actual</th>
                        <th>Cambiar Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-donaciones"></tbody>
            </table>
        </div>
    </div>

    <!-- 1. Cargar primero el archivo de configuración global -->
    <script src="config.js"></script>

    <!-- 2. Cargar después el script de administración -->
    <script src="admin.js"></script>
</body>

</html>
