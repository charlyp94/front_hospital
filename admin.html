<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión - Hospital Luis A. Güemes</title>
    <link rel="icon" type="image/jpg" href="logo.jpg">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #4a2c35;
            color: #333;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 480px;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('logo.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* Barra superior */
        .navbar {
            background: white;
            padding: 15px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar img {
            width: 50px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            font-weight: bold;
        }

        /* Botón Volver estilizado abajo del contenedor */
        .btn-volver {
            display: block;
            width: 150px;
            margin: 20px auto 50px auto;
            padding: 12px;
            background: #1e8449;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-volver:hover {
            background: #145a32;
        }

        /* Título */
        .page-title {
            text-align: center;
            color: white;
            padding: 40px 0;
        }

        .page-title h1 {
            margin: 0;
            font-size: 2.5em;
        }

        /* Contenedor de la tabla original para PC */
        .table-container {
            max-width: 1000px;
            margin: 0 auto 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .table-responsive {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #332126;
            color: white;
            padding: 15px;
        }

        td {
            border-bottom: 1px solid #ddd;
            padding: 15px;
            text-align: center;
        }

        /* Estilo del botón CAMBIAR */
        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background-color: #09cf37;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .dropdown-toggle:hover {
            background-color: #037b23;
        }

        /* --- VENTANA FLOTANTE (MODAL) CON ANIMACIÓN FLUIDA UNIVERSAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #4a2c35;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .modal-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            background-color: #f1f1f1;
            color: #333;
            transition: background-color 0.2s ease;
        }

        .modal-btn:hover {
            background-color: #e2e2e2;
        }

        .modal-btn.selected {
            background-color: #09cf37;
            color: white;
        }

        .modal-btn.selected:hover {
            background-color: #037b23;
        }

        .modal-btn-cerrar {
            background-color: #cc0000;
            color: white;
            margin-top: 15px;
        }

        .modal-btn-cerrar:hover {
            background-color: #a30000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 90px;
            width: 120px;
        }

        .logo-texto h2 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #111111;
        }

        .logo-texto p {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
        }

        /* --- ADAPTACIÓN PARA CELULARES --- */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 20px;
            }
            .page-title h1 {
                font-size: 1.8em;
                padding: 0 10px;
            }
            .table-container {
                padding: 15px;
                width: 95%;
                margin: 0 auto 30px auto;
            }
            .table-responsive {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            table {
                min-width: 750px;
            }
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo Hospital Luis A. Güemes" class="logo-img">
            <div class="logo-texto">
                <h2>HOSPITAL LUIS A. GÜEMES</h2>
                <p>A.O. III AGUARAY - SALTA</p>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="btn-volver" style="margin: 0; width: auto; padding: 10px 20px;">Volver al Inicio</a>
        </div>
    </div>

    <div class="page-title">
        <h1>Donaciones - Panel de Gestión</h1>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Fecha de Donación</th>
                        <th>DNI</th>
                        <th>Categoría</th>
                        <th>Cantidad</th>
                        <th>Estado Actual</th>
                        <th>Cambiar Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-donaciones"></tbody>
            </table>
        </div>
    </div>

    <!-- VENTANA FLOTANTE (MODAL) UNIVERSAL PARA CAMBIAR ESTADO -->
    <div id="modalEstado" class="modal-overlay">
        <div class="modal-content">
            <h3>Cambiar Estado</h3>
            <div id="modalOpciones"></div>
            <button class="modal-btn modal-btn-cerrar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <!-- 1. Cargar primero el archivo de configuración global -->
    <script src="config.js"></script>

    <!-- 2. Cargar después el script de administración -->
    <script src="admin.js"></script>
</body>

</html>
